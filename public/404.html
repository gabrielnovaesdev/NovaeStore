<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | NovaeStore</title>
    <!-- Usa o CDN do Tailwind para que a página 404 seja completamente independente e levíssima -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#08080c',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #08080c;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        background-image: radial-gradient(circle at 50% -20%, #1e1b4b 0%, transparent 60%);
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
    
    <div class="max-w-md w-full">
      <!-- Ícone Astronauta/Espaço simplificado -->
      <div class="mb-8 animate-float inline-block">
        <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
          <line x1="9" y1="9" x2="9.01" y2="9"></line>
          <line x1="15" y1="9" x2="15.01" y2="9"></line>
        </svg>
      </div>
      
      <h1 class="text-7xl font-bold text-white mb-2 tracking-tighter">404</h1>
      <h2 class="text-2xl font-semibold text-slate-200 mb-4">Perdido no Espaço!</h2>
      <p class="text-slate-400 mb-8 leading-relaxed">
        Ops! Parece que o buraco negro sugou esta página. O link que você clicou não existe ou os produtos foram abduzidos.
      </p>
      
      <!-- O href vai pra raiz. No GitHub Pages o repo ficará em /NovaeStore/ -->
      <!-- Usa JavaScript simples para voltar para a raiz do domínio com segurança, suportando GitHub Pages -->
      <a href="#" onclick="window.location.href = window.location.pathname.startsWith('/NovaeStore') ? '/NovaeStore/' : '/'" class="inline-flex items-center justify-center gap-2 px-8 py-3.5 border border-transparent text-base font-medium rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 hover:scale-105 transition-all duration-300 shadow-lg shadow-indigo-500/25 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        Retornar à Loja
      </a>
    </div>

  </body>
</html>
